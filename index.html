<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PromptForge V7</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#070b14;color:#fff}
.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#111827;border:1px solid #29354a;border-radius:18px;padding:20px;margin-bottom:16px}
h1{margin:0 0 6px}.sub,.small{color:#9aa8bd}label{display:block;font-weight:700;margin:15px 0 7px}
textarea,select{width:100%;background:#0b1220;color:#fff;border:1px solid #354158;border-radius:12px;padding:13px;font-size:16px}
textarea{min-height:150px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button,a{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
#generate{width:100%;margin-top:18px;background:#6d5dfc;color:#fff}.secondary{background:#263249;color:#fff}
video{width:100%;margin-top:10px;border-radius:14px;background:#000}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.error{color:#ff9b9b}.hidden{display:none}@media(max-width:650px){.grid,.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>🎬 PromptForge V7</h1>
<div class="sub">Turn a story into a real AI-generated video.</div>
<label>Your story</label>
<textarea id="story" placeholder="A young African boy walks through a mysterious forest and discovers a glowing blue stone."></textarea>
<div class="grid">
<div><label>Video length</label>
<select id="duration"><option value="8">8 seconds</option><option value="15">15 seconds</option><option value="20" selected>20 seconds</option></select>
<div class="small">20 seconds uses a 6s generation + two 7s extensions.</div></div>
<div><label>Aspect ratio</label>
<select id="ratio"><option>16:9</option><option>9:16</option></select></div>
</div>
<label>Style</label>
<select id="style"><option>Cinematic realistic</option><option>Hollywood cinematic</option><option>African film realism</option><option>Fantasy realism</option><option>3D animated film</option><option>Anime cinematic</option><option>Documentary realism</option></select>
<button id="generate">GENERATE VIDEO</button>
<div id="status"></div>
</div>
<div id="result" class="card hidden"><h2>Your video</h2><video id="player" controls playsinline></video>
<div class="actions"><a id="download" class="secondary" download="promptforge-video.mp4">SAVE VIDEO</a><button id="new" class="secondary">NEW VIDEO</button></div></div>
</div>
<script>
const BACKEND_URL="PASTE_YOUR_BACKEND_URL_HERE";
const $=id=>document.getElementById(id);
$("generate").onclick=async()=>{
 const story=$("story").value.trim(); if(!story){$("status").innerHTML='<span class="error">Enter your story first.</span>';return}
 if(BACKEND_URL.includes("PASTE_YOUR")){$("status").innerHTML='<span class="error">First connect the backend URL in index.html.</span>';return}
 $("generate").disabled=true;$("generate").textContent="GENERATING…";$("status").textContent="Generating your video. This may take several minutes…";
 try{
  const r=await fetch(BACKEND_URL+"/generate",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({story,duration:Number($("duration").value),aspectRatio:$("ratio").value,style:$("style").value})});
  const d=await r.json();if(!r.ok)throw Error(d.error||"Generation failed");
  const url=d.videoUrl.startsWith("http")?d.videoUrl:BACKEND_URL+d.videoUrl;
  $("player").src=url;$("download").href=url;$("result").classList.remove("hidden");$("status").textContent="✅ Video ready!";$("result").scrollIntoView({behavior:"smooth"});
 }catch(e){$("status").innerHTML='<span class="error">❌ '+e.message.replace(/</g,"&lt;")+'</span>'}
 $("generate").disabled=false;$("generate").textContent="GENERATE VIDEO";
};
$("new").onclick=()=>{ $("player").removeAttribute("src");$("player").load();$("result").classList.add("hidden");$("status").textContent=""};
</script>
</body></html>
