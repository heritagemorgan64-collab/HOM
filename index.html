<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptForge V6</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b1020;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 18px;
}

.card {
  background: #141b2d;
  border: 1px solid #2b3856;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
}

h1 {
  margin: 0 0 6px;
  font-size: 30px;
}

h2 {
  margin-top: 0;
}

.subtitle {
  color: #9eabc7;
  margin-bottom: 20px;
}

label {
  display: block;
  margin: 14px 0 7px;
  font-weight: bold;
}

textarea,
input,
select {
  width: 100%;
  background: #0c1324;
  color: #ffffff;
  border: 1px solid #344361;
  border-radius: 10px;
  padding: 12px;
  font-size: 15px;
}

textarea {
  min-height: 140px;
  resize: vertical;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 13px 17px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin: 10px 6px 0 0;
  color: white;
  background: #273451;
}

.generate {
  background: #6878ff;
}

.clear {
  background: #442632;
}

.status {
  margin-top: 12px;
  color: #72edaa;
  font-weight: bold;
}

.scene {
  background: #0c1324;
  border: 1px solid #2d3b59;
  border-radius: 12px;
  padding: 15px;
  margin: 10px 0;
  line-height: 1.55;
}

.time {
  color: #9baaff;
  font-weight: bold;
  margin-bottom: 7px;
}

pre {
  white-space: pre-wrap;
  word-wrap: break-word;
  background: #0c1324;
  border: 1px solid #2d3b59;
  border-radius: 12px;
  padding: 15px;
  line-height: 1.55;
}

.small {
  color: #8795b3;
  font-size: 13px;
}

@media (max-width: 650px) {
  .grid {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 25px;
  }

  .container {
    padding: 12px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>PROMPTFORGE V6</h1>

    <div class="subtitle">
      Turn your story into a concrete, timed cinematic video prompt.
    </div>

    <label for="story">
      Video idea / story
    </label>

    <textarea
      id="story"
      maxlength="2000"
      placeholder="Example: A young African boy walks through a mysterious forest and discovers a glowing blue stone."
    ></textarea>


    <div class="grid">

      <div>
        <label for="duration">
          Duration
        </label>

        <select id="duration">
          <option value="20">20 seconds</option>
          <option value="15">15 seconds</option>
          <option value="10">10 seconds</option>
          <option value="5">5 seconds</option>
        </select>
      </div>


      <div>
        <label for="style">
          Visual style
        </label>

        <select id="style">
          <option>Cinematic realistic</option>
          <option>Hollywood cinematic</option>
          <option>African film realism</option>
          <option>Fantasy realism</option>
          <option>Anime cinematic</option>
          <option>3D animated film</option>
          <option>Documentary realism</option>
        </select>
      </div>


      <div>
        <label for="camera">
          Camera
        </label>

        <select id="camera">
          <option>Dynamic cinematic camera</option>
          <option>Slow cinematic camera</option>
          <option>Handheld documentary camera</option>
          <option>Epic sweeping camera</option>
          <option>Intimate character-focused camera</option>
        </select>
      </div>


      <div>
        <label for="ratio">
          Aspect ratio
        </label>

        <select id="ratio">
          <option>16:9 landscape</option>
          <option>9:16 vertical</option>
          <option>1:1 square</option>
        </select>
      </div>

    </div>


    <label for="continuity">
      Continuity / character details
    </label>

    <input
      id="continuity"
      placeholder="Example: same boy, red shirt, black trousers throughout"
    >


    <label for="dialogue">
      Dialogue / voice
    </label>

    <input
      id="dialogue"
      placeholder="Example: Boy whispers, 'What is that?'"
    >


    <button class="generate" id="generate">
      Generate V6 Prompt
    </button>

    <button id="copy">
      Copy All
    </button>

    <button class="clear" id="clear">
      Clear
    </button>

    <div id="status" class="status"></div>

  </div>


  <div class="card">

    <h2>Story-driven timeline</h2>

    <div id="timeline">

      <div class="small">
        Your generated scenes will appear here.
      </div>

    </div>

  </div>


  <div class="card">

    <h2>Final V6 prompt</h2>

    <pre id="final">
Generate a prompt to see the complete cinematic prompt here.
    </pre>

  </div>

</div>


<script>

"use strict";


/* =========================================================
   BASIC HELPERS
========================================================= */

function clean(text) {

  return text
    .replace(/\s+/g, " ")
    .replace(/\s+([,.!?])/g, "$1")
    .trim();

}


function get(id) {

  return document.getElementById(id);

}


/* =========================================================
   SUBJECT DETECTION
========================================================= */

function detectSubject(story) {

  const patterns = [

    /\b((?:a|an|the)\s+(?:young|old|little|small|African\s+)?(?:boy|girl|man|woman|child|children|person|soldier|farmer|scientist|king|queen|prince|princess))\b/i,

    /\b((?:a|an|the)\s+[A-Za-z]+(?:\s+[A-Za-z]+){0,2})\s+(?:walks|runs|enters|moves|looks|finds|discovers|sees|stands|sits)\b/i

  ];

  for (const pattern of patterns) {

    const match = story.match(pattern);

    if (match) {

      return clean(match[1]);

    }

  }

  return "the main subject";

}


/* =========================================================
   LOCATION DETECTION
========================================================= */

function detectLocation(story) {

  const patterns = [

    /\b(?:through|inside|in|into|across|around|near|beside|under|over)\s+(?:a|an|the)\s+([^,.!?]+?)(?=\s+(?:and|where|before|after|as|while|then)\b|[,.!?]|$)/i,

    /\b(?:at|on)\s+(?:a|an|the)\s+([^,.!?]+?)(?=\s+(?:and|where|before|after|as|while|then)\b|[,.!?]|$)/i

  ];

  for (const pattern of patterns) {

    const match = story.match(pattern);

    if (match) {

      return clean(match[1]);

    }

  }

  return "";

}


/* =========================================================
   ACTION DETECTION
========================================================= */

function detectAction(story) {

  const pattern =
    /\b((?:walks|runs|enters|moves|climbs|jumps|flies|drives|rides|looks|searches|follows|carries|holds|pushes|opens|touches|reaches|stands|sits|kneels|turns|approaches|discovers|finds|sees|notices)\b[^,.!?]*)/i;

  const match = story.match(pattern);

  return match ? clean(match[1]) : "";

}


/* =========================================================
   DISCOVERY / IMPORTANT OBJECT
========================================================= */

function detectDiscovery(story) {

  const pattern =
    /\b(?:discovers|discover|finds|find|sees|see|spots|spot|notices|notice)\s+(?:a|an|the)\s+([^,.!?]+)/i;

  const match = story.match(pattern);

  return match ? clean(match[1]) : "";

}


/* =========================================================
   VISUAL DETAILS
========================================================= */

function detectVisualDetails(story) {

  const possibleDetails = [

    "red",
    "blue",
    "green",
    "golden",
    "yellow",
    "white",
    "black",
    "purple",
    "orange",
    "silver",
    "pink",

    "glowing",
    "bright",
    "shining",
    "dark",
    "ancient",
    "mysterious",
    "smooth",
    "rough",
    "huge",
    "tiny",
    "giant",
    "small",
    "strange",
    "beautiful",
    "old",
    "young",
    "wet",
    "misty"
  ];

  const found = [];

  const lower = story.toLowerCase();

  possibleDetails.forEach(function(detail) {

    if (lower.includes(detail)) {

      found.push(detail);

    }

  });

  return [...new Set(found)];

}


/* =========================================================
   STORY ACTION CLAUSES
========================================================= */

function splitStoryActions(story) {

  return story
    .split(
      /\s+(?:and then|then|and|while|as|before|after)\s+/i
    )
    .map(clean)
    .filter(part => part.length > 2);

}


/* =========================================================
   BUILD 20 SECOND STORY
========================================================= */

function build20SecondStory(story) {

  const subject = detectSubject(story);

  const location = detectLocation(story);

  const action = detectAction(story);

  const discovery = detectDiscovery(story);

  const details = detectVisualDetails(story);

  const locationText =
    location
      ? " in " + location
      : "";

  const scenes = [];


  /* 0-5 */

  scenes.push(

    subject +
    " begins the story" +
    locationText +
    ". " +

    (
      action
        ? "Show the action \"" +
          action +
          "\" as a real physical event."
        : "Show the opening action clearly and naturally."
    ) +

    " Establish the environment and the subject's position."

  );


  /* 5-10 */

  if (discovery) {

    scenes.push(

      subject +
      " notices " +
      discovery +
      ". " +

      "The subject slows down, stops, turns toward it, and looks carefully. " +

      "Make the moment of noticing clearly visible."

    );

  } else {

    scenes.push(

      "Continue the next concrete action from the original story. " +

      "Show the subject physically interacting with the environment " +

      "and preserve the exact story sequence."

    );

  }


  /* 10-15 */

  if (discovery) {

    let visualDescription = "";

    if (details.length > 0) {

      visualDescription =
        " Emphasize its " +
        details.join(", ") +
        " appearance.";

    }

    scenes.push(

      subject +
      " approaches " +
      discovery +
      " and reveals it clearly. " +

      "Show its shape, position, texture, color, light, " +
      "and interaction with the surrounding environment." +

      visualDescription

    );

  } else {

    scenes.push(

      "Continue the central event from the original story. " +

      "Show clear physical cause and effect rather than generic cinematic instructions."

    );

  }


  /* 15-20 */

  if (discovery) {

    scenes.push(

      "Complete the discovery. " +

      subject +
      " is now beside " +
      discovery +
      " and reacts naturally to what has been found. " +

      "Hold on the subject and the important object together " +

      "so the audience clearly understands the discovery."

    );

  } else {

    scenes.push(

      "Complete the final action stated in the original story. " +

      "End on a clear visual moment that directly follows " +

      "from what happened before."

    );

  }


  return scenes;

}


/* =========================================================
   BUILD SHORTER DURATIONS
========================================================= */

function buildScenes(story, duration) {

  if (duration === 20) {

    return build20SecondStory(story);

  }


  const subject = detectSubject(story);

  const location = detectLocation(story);

  const action = detectAction(story);

  const discovery = detectDiscovery(story);


  const locationText =
    location
      ? " in " + location
      : "";


  if (duration === 15) {

    return [

      subject +
      " begins the story" +
      locationText +
      ". " +
      (
        action
          ? "Show the action \"" + action + "\" clearly."
          : "Show the opening action clearly."
      ),

      discovery

        ? subject +
          " notices " +
          discovery +
          ", stops, and moves closer to investigate it."

        : "Continue the next concrete action described by the story.",


      discovery

        ? "Reveal " +
          discovery +
          " clearly as " +
          subject +
          " examines it."

        : "Complete the main event described in the story."

    ];

  }


  if (duration === 10) {

    return [

      subject +
      " begins the story" +
      locationText +
      ". " +

      (
        action
          ? "Show \"" + action + "\" as a physical visible action."
          : "Show the opening event clearly."
      ),

      discovery

        ? subject +
          " notices " +
          discovery +
          " and approaches it, revealing the discovery clearly."

        : "Continue and complete the next concrete action from the story."

    ];

  }


  return [

    subject +
    " performs the main action described in the story" +
    locationText +
    ". " +

    (
      discovery
        ? "The subject discovers " + discovery + " and reacts naturally."
        : "Make the main event clearly visible."
    )

  ];

}


/* =========================================================
   GENERATE
========================================================= */

function generatePrompt() {

  const story =
    clean(get("story").value);


  if (!story) {

    get("status").textContent =
      "Enter a story first.";

    return;

  }


  const duration =
    Number(get("duration").value);


  const style =
    get("style").value;


  const camera =
    get("camera").value;


  const ratio =
    get("ratio").value;


  const continuity =
    clean(get("continuity").value);


  const dialogue =
    clean(get("dialogue").value);


  const scenes =
    buildScenes(
      story,
      duration
    );


  const timeline =
    get("timeline");


  timeline.innerHTML = "";


  const secondsPerScene =
    duration / scenes.length;


  scenes.forEach(function(scene, index) {

    const start =
      Math.round(
        index * secondsPerScene
      );


    const end =
      Math.round(
        (index + 1) *
        secondsPerScene
      );


    const box =
      document.createElement("div");


    box.className =
      "scene";


    const time =
      document.createElement("div");


    time.className =
      "time";


    time.textContent =
      start + "–" + end + "s";


    const description =
      document.createElement("div");


    description.textContent =
      scene;


    box.appendChild(time);

    box.appendChild(description);

    timeline.appendChild(box);

  });


  /* =======================================================
     FINAL PROMPT
  ======================================================= */


  let finalPrompt = "";


  finalPrompt +=
    "Create a " +
    duration +
    "-second " +
    style +
    " video in " +
    ratio +
    ".\n\n";


  finalPrompt +=
    "ORIGINAL STORY:\n" +
    story +
    "\n\n";


  finalPrompt +=
    "STORY-DRIVEN TIMELINE:\n";


  scenes.forEach(function(scene, index) {

    const start =
      Math.round(
        index * secondsPerScene
      );


    const end =
      Math.round(
        (index + 1) *
        secondsPerScene
      );


    finalPrompt +=
      start +
      "–" +
      end +
      "s: " +
      scene +
      "\n";

  });


  finalPrompt +=
    "\n";


  finalPrompt +=
    "CAMERA:\n" +
    camera +
    ". Use purposeful framing and camera movement that follows the actual action. Avoid random camera movement.\n\n";


  finalPrompt +=
    "CONTINUITY:\n";


  finalPrompt +=
    continuity ||

    "Keep the same characters, clothing, environment, props, lighting direction, physical positions, and visual identity consistent throughout the video.";


  finalPrompt +=
    "\n\n";


  finalPrompt +=
    "DIALOGUE / VOICE:\n";


  finalPrompt +=
    dialogue ||

    "No additional dialogue unless it is naturally required by the original story.";


  finalPrompt +=
    "\n\n";


  finalPrompt +=
    "VISUAL QUALITY:\n" +

    "Natural realistic movement, believable body mechanics, cinematic lighting, detailed environment, realistic textures, consistent character appearance, physically believable interaction between characters and objects, strong depth, and smooth temporal continuity.\n\n";


  finalPrompt +=
    "IMPORTANT STORY RULES:\n" +

    "1. Visually depict the actual events in the original story.\n" +

    "2. Preserve the order of events.\n" +

    "3. Preserve every named character, location, object, color, discovery, and action.\n" +

    "4. Convert words into visible physical actions.\n" +

    "5. Do not replace the story with generic filmmaking instructions.\n" +

    "6. Do not introduce unrelated characters, objects, locations, or plot developments.\n" +

    "7. Each scene must continue naturally from the previous scene.\n" +

    "8. Keep the discovered object or important event visually consistent after it appears.";


  get("final").textContent =
    finalPrompt;


  get("status").textContent =
    "✓ V6 prompt generated successfully.";

}


/* =========================================================
   COPY
========================================================= */

async function copyPrompt() {

  const text =
    get("final").textContent;


  if (
    !text ||
    text.startsWith(
      "Generate a prompt"
    )
  ) {

    get("status").textContent =
      "Generate a prompt first.";

    return;

  }


  try {

    await navigator.clipboard.writeText(
      text
    );

  } catch (error) {

    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.value =
      text;

    document.body.appendChild(
      textarea
    );

    textarea.select();

    document.execCommand(
      "copy"
    );

    textarea.remove();

  }


  get("status").textContent =
    "✓ Prompt copied.";

}


/* =========================================================
   CLEAR
========================================================= */

function clearAll() {

  get("story").value = "";

  get("continuity").value = "";

  get("dialogue").value = "";

  get("timeline").innerHTML =
    '<div class="small">Your generated scenes will appear here.</div>';

  get("final").textContent =
    "Generate a prompt to see the complete cinematic prompt here.";

  get("status").textContent =
    "";

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

get("generate")
  .addEventListener(
    "click",
    generatePrompt
  );


get("copy")
  .addEventListener(
    "click",
    copyPrompt
  );


get("clear")
  .addEventListener(
    "click",
    clearAll
