<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PromptForge — 20s Video Prompt Generator</title>
<style>
:root{color-scheme:dark;--bg:#080b14;--panel:#101625;--panel2:#151c2e;--line:#29334b;--text:#f5f7ff;--muted:#9ca8c2;--accent:#7c5cff;--accent2:#20d9a3;--danger:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh;padding:20px;max-width:1050px;margin:auto}.hero{padding:18px 0 10px}.badge{display:inline-block;background:#211b42;color:#b9aaff;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}.hero h1{font-size:clamp(28px,6vw,48px);margin:12px 0 6px}.hero p{color:var(--muted);margin:0;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}textarea,input,select{width:100%;background:#0a0f1c;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;outline:none}textarea:focus,input:focus,select:focus{border-color:var(--accent)}textarea{min-height:135px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#0b101d;color:var(--muted);padding:9px 12px;border-radius:10px;cursor:pointer}.chip.active{background:#241d4b;color:white;border-color:var(--accent)}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#1c2538;color:white;border:1px solid var(--line)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.timeline{display:grid;gap:10px}.scene{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}.scene strong{color:#b9aaff}.scene .time{font-size:12px;color:var(--accent2);font-weight:800}.prompt{white-space:pre-wrap;line-height:1.6;background:#080d18;border:1px solid var(--line);border-radius:14px;padding:16px;min-height:250px}.small{font-size:12px;color:var(--muted)}.count{text-align:right;color:var(--muted);font-size:12px;margin-top:5px}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{grid-template-columns:1fr}.app{padding:14px}}
</style></head>
<body><main class="app">
<section class="hero"><span class="badge">PROMPTFORGE V2</span><h1>Text → 20s Video Prompt</h1><p>Turn a simple idea into a structured, cinematic prompt with a timed action sequence.</p></section>
<div class="grid">
<section class="card full"><label for="idea">Your video idea</label><textarea id="idea" maxlength="1200" placeholder="Example: A young African boy discovers a glowing ancient door in a forest at night."></textarea><div class="count"><span id="count">0</span>/1200</div></section>
<section class="card"><label>Duration</label><div class="chips" id="durations"><button class="chip active" data-sec="20">20 sec</button><button class="chip" data-sec="15">15 sec</button><button class="chip" data-sec="10">10 sec</button><button class="chip" data-sec="5">5 sec</button></div></section>
<section class="card"><label for="style">Visual style</label><select id="style"><option>Cinematic realistic</option><option>Hollywood action</option><option>Epic fantasy</option><option>African cinematic</option><option>Anime</option><option>3D animated film</option><option>Documentary</option><option>Music video</option></select></section>
<section class="card"><label for="camera">Camera language</label><select id="camera"><option>Dynamic cinematic camera</option><option>Slow dolly and close-ups</option><option>Handheld realistic</option><option>Epic wide shots and crane moves</option><option>Fast action tracking</option><option>Dreamy floating camera</option></select></section>
<section class="card"><label for="ratio">Aspect ratio</label><select id="ratio"><option>16:9 landscape</option><option>9:16 vertical</option><option>1:1 square</option><option>21:9 widescreen</option></select></section>
<section class="card full"><label for="character">Character / continuity details (optional)</label><input id="character" maxlength="500" placeholder="Example: 18-year-old boy, short black hair, blue shirt, brown trousers; keep appearance identical throughout."></section>
<section class="card full"><label for="dialogue">Dialogue / voice (optional)</label><input id="dialogue" maxlength="500" placeholder="Example: He whispers, “What is this place?” — natural Nigerian English accent. Leave blank for no dialogue."></section>
<section class="card full"><label>Generate</label><div class="actions"><button class="primary" id="generate">✨ Generate Prompt</button><button class="secondary" id="copy">📋 Copy Prompt</button><button class="secondary" id="clear">Clear</button></div></section>
<section class="card full"><label>Timed storyboard</label><div id="timeline" class="timeline"><div class="small">Your 20-second scene breakdown will appear here.</div></div></section>
<section class="card full"><label>Final prompt</label><div id="output" class="prompt">Enter an idea and tap “Generate Prompt”.</div></section>
</div></main>
<script>
const $=id=>document.getElementById(id);let duration=20;
$('idea').addEventListener('input',()=>{$('count').textContent=$('idea').value.length});
document.querySelectorAll('#durations .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#durations .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');duration=+b.dataset.sec});
function clean(s){return s.trim().replace(/\s+/g,' ')}
function scenes(sec){if(sec===5)return [['0–2s','Establish the location and subject immediately with a strong visual hook.'],['2–4s','Show the main action clearly with purposeful camera movement.'],['4–5s','Finish on a memorable reaction or visual beat; clean cinematic ending.']];if(sec===10)return [['0–3s','Wide establishing shot introduces the world, subject, atmosphere, and visual hook.'],['3–6s','Move into the main action; reveal the important change or discovery.'],['6–8s','Increase intensity with a closer shot and a clear physical reaction.'],['8–10s','Resolve with a strong final image, reaction, or reveal; hold briefly at the end.']];if(sec===15)return [['0–4s','Establish the environment and subject with cinematic composition and immediate visual context.'],['4–8s','Begin the central action and progressively reveal what matters in the scene.'],['8–12s','Build the emotional or physical peak using closer framing and purposeful movement.'],['12–15s','Deliver the reveal or payoff, then end on a stable memorable frame.']];return [['0–5s','Opening wide/establishing shot: clearly establish location, time, subject, mood, and the visual hook.'],['5–10s','Medium/tracking shot: begin the main action and reveal the important development naturally.'],['10–15s','Close/impact shot: build to the emotional or physical peak, with realistic reactions and controlled camera motion.'],['15–20s','Final hero/reveal shot: resolve the action, hold the strongest image for a moment, and end cleanly without abrupt distortion.']];}
function makePrompt(){const idea=clean($('idea').value);if(!idea){$('idea').focus();return}const style=$('style').value,cam=$('camera').value,ratio=$('ratio').value,char=clean($('character').value),dialogue=clean($('dialogue').value);const ss=scenes(duration);let timeline=ss.map(x=>`<div class="scene"><div class="time">${x[0]}</div><div>${x[1]}</div></div>`).join('');$('timeline').innerHTML=timeline;let timelineText=ss.map(x=>`${x[0]} — ${x[1]}`).join('\n');let p=`Create a ${duration}-second ${style} video in ${ratio}.\n\nCORE IDEA:\n${idea}\n\nCONTINUITY:\n${char||'Keep all characters, clothing, faces, props, environment, and spatial relationships visually consistent from beginning to end.'}\n\nTIMELINE:\n${timelineText}\n\nCAMERA:\n${cam}. Use intentional framing, natural depth of field, realistic motion blur, smooth transitions between shots, and physically believable camera movement.\n\nLIGHTING & ENVIRONMENT:\nUse cinematic lighting appropriate to the location and time of day. Preserve realistic textures, atmospheric depth, reflections, shadows, and consistent light direction throughout the shot.\n\nPERFORMANCE & MOTION:\nNatural human/creature movement, believable weight and physics, expressive facial reactions, accurate hand/object interaction, no frozen poses.\n\nDIALOGUE / AUDIO:\n${dialogue||'No spoken dialogue unless naturally required. Add realistic environmental ambience, synchronized sound effects, and subtle cinematic audio.'}\n\nQUALITY:\nHigh-detail cinematic image, coherent anatomy, stable identity, stable clothing and props, realistic materials, clean composition, smooth temporal consistency, professional film look.\n\nNEGATIVE PROMPT:\nAvoid flicker, frame jumps, identity changes, extra fingers or limbs, warped faces, duplicated people, floating objects, inconsistent clothing, broken anatomy, unnatural physics, unreadable text, sudden lighting changes, camera shake unless intentionally requested, and abrupt ending.`;$('output').textContent=p}
$('generate').onclick=makePrompt;
$('copy').onclick=async()=>{const text=$('output').textContent;if(!text||text.startsWith('Enter an idea'))return;try{await navigator.clipboard.writeText(text);$('copy').textContent='✓ Copied';setTimeout(()=>$('copy').textContent='📋 Copy Prompt',1500)}catch(e){alert('Copy failed. Long-press the prompt to copy it.')}};
$('clear').onclick=()=>{$('idea').value='';$('count').textContent='0';$('character').value='';$('dialogue').value='';$('output').textContent='Enter an idea and tap “Generate Prompt”.';$('timeline').innerHTML='<div class="small">Your scene breakdown will appear here.</div>'};
</script></body></html>
